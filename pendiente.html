<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Documentación en revisión — Curandis</title>
<!-- Cabeceras de seguridad recomendadas: limitan desde dónde puede cargar
     scripts/estilos/imágenes esta página. La versión final debería enviar
     estas mismas reglas como cabeceras HTTP reales desde el hosting. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://formsubmit.co; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; script-src 'self' 'unsafe-inline';">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="site-accent" aria-hidden="true"></div>

  <nav class="topbar simple-topbar"><div class="brand" onclick="goToDashboard()"><img src="photos/logo.png" alt=""><span>Curandis</span></div><div class="links"><a onclick="logout()">Salir</a></div></nav>
  <div class="pending-screen">
    <div class="pending-icon"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#C9861E" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg></div>
    <h2>Tu registro está en revisión</h2>
    <p style="margin-bottom:16px;">Un coordinador de Curandis está validando los datos de tu registro. Recibirás un aviso por correo cuando tu cuenta sea aprobada y puedas acceder a la aplicación.</p>
    <p id="registration-email-status" style="font-size:13px;margin-bottom:18px;"></p>
    <button class="btn btn-ghost" onclick="retryRegistrationEmail()">Reenviar solicitud por correo</button>
    <div class="field" style="max-width:280px;margin:24px auto 0;text-align:left;">
      <label for="approval-code">Código enviado por el coordinador</label>
      <input id="approval-code" type="text" inputmode="numeric" maxlength="6" placeholder="000000">
      <div class="error-text" id="approval-code-error">El código no es válido.</div>
    </div>
    <button class="btn btn-primary" style="margin-top:10px;" onclick="approveWithCode()">Confirmar verificación</button>
  </div>

<script src="app.js"></script>
<script>
  if(!requireAuth()) { /* redirige */ }
</script>
</body>
</html>
